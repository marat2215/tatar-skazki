<!doctype html>
<html lang="tt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Уеннар — татарские игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="common.js"></script>
<style>
:root{--bg:#f6f3ec;--fg:#1f2a24;--card:#fff;--bd:#e3dccb}
@media(prefers-color-scheme:dark){:root{--bg:#161b18;--fg:#eef2ee;--card:#222a25;--bd:#3c463f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;max-width:520px;margin:auto;padding:16px}
h1{margin:4px 0 2px}p{margin:0 0 16px;opacity:.75}
a.g{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;text-decoration:none;color:inherit}
a.g .i{font-size:44px}a.g b{font-size:18px}a.g small{display:block;opacity:.7}
</style></head><body>
<h1>🎮 <span id="h"></span></h1><p id="sub"></p><div id="list"></div>
<script>
const G=[
 ["shurale.html","🌲","Шүрәле",{ru:"Убегите от Шурале: выбирайте верный перевод слов",en:"Escape from Shurale: pick the right translation",tr:"Şüräle'den kaç: doğru çeviriyi seç",fi:"Pakene Šürälea: valitse oikea käännös"}],
 ["echpochmak.html","🥟","Эчпочмак пешер",{ru:"Готовьте с бабушкой по татарским рецептам",en:"Cook with grandma using Tatar recipes",tr:"Büyükannenle Tatar yemekleri pişir",fi:"Kokkaa mummon kanssa tataarilaisia ruokia"}],
 ["suz.html","🟩","Сүз уены",{ru:"Угадайте татарское слово дня за 6 попыток",en:"Guess the Tatar word of the day in 6 tries",tr:"Günün Tatarca kelimesini 6 denemede bul",fi:"Arvaa päivän tataarinkielinen sana 6 yrityksellä"}]];
document.getElementById("h").innerHTML=ttFull("Уеннар");
document.getElementById("sub").textContent=ui({ru:"Играйте и учите татарский язык",en:"Play and learn the Tatar language",tr:"Oyna ve Tatarca öğren",fi:"Pelaa ja opi tataaria"});
document.getElementById("list").innerHTML=G.map(([u,i,n,d])=>`<a class="g" href="${u}${QS}"><span class="i">${i}</span><span><b>${ttFull(n)}</b><small>${ui(d)}</small></span></a>`).join("");
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><title>Батыр Арена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Russo+One&display=swap">
<style>
/* Layout: one-screen fantasy arcade — HUD bar, painted arena (hero vs foe), question scroll below */
:root{
  --night:#170d2e; --plum:#2a1752; --gold:#ffc83d; --goldd:#b46a00; --ember:#ff5e3a; --jade:#2fe39a; --sky:#47b8ff; --rose:#ff4f8b; --ink:#fff6e6; --dim:#c3b4ee; --line:#2a1638;
  --display:"Russo One","Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow-x:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{display:inline-block;vertical-align:middle;flex:none}.ic svg{width:100%;height:100%;display:block}
.sprite svg{width:100%;height:100%;display:block;overflow:visible}
.app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.bgsky{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 420px at 50% 115%,#ff5e3a40,transparent 60%),
  radial-gradient(700px 400px at 90% -10%,#47b8ff33,transparent 60%),
  linear-gradient(#170d2e,#2a1752 70%,#3b1a4f)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
/* HUD */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;letter-spacing:1px;margin-right:auto;color:var(--gold);text-shadow:0 3px 0 var(--goldd),0 6px 14px #0008;-webkit-text-stroke:1px #6a3500}
.chip{background:linear-gradient(#ffffff1c,#ffffff0a);border:2px solid #ffffff26;border-radius:999px;padding:5px 12px 5px 6px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;box-shadow:inset 0 -3px 0 #0003}
.chip.icon{padding:6px}
/* buttons */
.btn{font-family:var(--display);font-size:17px;padding:13px 20px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
 background:linear-gradient(180deg,#ffe07a,#ff9f1c);color:#3a1600;box-shadow:0 6px 0 #b45a00,0 10px 22px #ff9f1c44,inset 0 2px 0 #fff8;transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 #fff6}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b45a00,inset 0 2px 0 #fff8}
.btn.blue{background:linear-gradient(180deg,#8fdcff,#2a8cff);color:#04183a;box-shadow:0 6px 0 #1452a8,0 10px 22px #2a8cff44,inset 0 2px 0 #fff8}
.btn.green{background:linear-gradient(180deg,#8ff8cc,#19c27a);color:#03301c;box-shadow:0 6px 0 #0d7a4b,0 10px 22px #19c27a44,inset 0 2px 0 #fff8}
.btn.violet{background:linear-gradient(180deg,#d4a8ff,#8a4dff);color:#1a0640;box-shadow:0 6px 0 #4b1fa8,0 10px 22px #8a4dff55,inset 0 2px 0 #fff8}
.btn[disabled]{filter:grayscale(.9) brightness(.55);cursor:not-allowed}
.screen{display:flex;flex-direction:column;gap:14px;flex:1}
h1{font-family:var(--display);font-size:clamp(32px,7.5vw,52px);line-height:1.02;margin:6px 0 0;text-wrap:balance;text-shadow:0 4px 0 #0007}
h1 em{font-style:normal;color:var(--gold)}
h2{font-family:var(--display);font-size:21px;margin:2px 0;text-wrap:balance}
.sub{color:var(--dim);margin:0;max-width:60ch;line-height:1.5}
.frame{background:linear-gradient(160deg,#3a2270ee,#21114aee);border:2px solid #6b4fb0;border-radius:22px;box-shadow:inset 0 0 0 2px #0004,0 12px 30px #0006;padding:14px;position:relative}
.frame::before{content:"";position:absolute;inset:5px;border:1px dashed #ffc83d44;border-radius:17px;pointer-events:none}
/* hero select */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.hcard{border-radius:22px;padding:10px 12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s;background:linear-gradient(170deg,var(--c1),var(--c2));border:3px solid #ffffff30;box-shadow:inset 0 -6px 0 #0003,0 10px 24px #0005;position:relative;overflow:hidden}
.hcard::after{content:"";position:absolute;inset:0;background:radial-gradient(160px 120px at 50% 30%,#ffffff30,transparent 70%);pointer-events:none}
.hcard:hover{transform:translateY(-4px)}
.hcard.sel{border-color:var(--gold);box-shadow:0 0 0 4px #ffc83d55,0 14px 34px #ffc83d33}
.hcard .sprite{height:150px;margin:0 auto;width:140px;animation:bob 2.4s ease-in-out infinite}
.hcard b{font-family:var(--display);font-size:20px;text-shadow:0 2px 0 #0006}
.hcard small{color:#fff;opacity:.85;line-height:1.4}
.stats{display:flex;gap:6px;font-size:12px;font-weight:800;flex-wrap:wrap}
.stats span{background:#0005;border-radius:9px;padding:3px 8px 3px 4px;display:inline-flex;gap:4px;align-items:center}
/* map */
.road{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:560px){.road{grid-template-columns:repeat(3,1fr)}}
.node{aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4b2f8a,#1d0f3d);border:4px solid #6b4fb0;display:grid;place-items:center;position:relative;box-shadow:inset 0 -6px 0 #0005,0 8px 18px #0006;transition:transform .15s}
.node:not([disabled]):hover{transform:scale(1.06)}
.node .sprite{width:78%;height:78%;margin-top:-6%}
.node.done{border-color:var(--jade);background:radial-gradient(circle at 50% 35%,#1f8a5f,#0d3b2c)}
.node.cur{border-color:var(--gold);animation:glow 1.6s ease-in-out infinite}
.node.boss{border-width:5px}
.node.boss::before{content:"БОСС";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:900 10px var(--body);background:var(--ember);padding:2px 7px;border-radius:8px;border:2px solid var(--line);z-index:2}
.node.lock{filter:grayscale(1) brightness(.45);cursor:not-allowed}
.node .lk{position:absolute;inset:0;display:grid;place-items:center}
.node .tag{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-weight:800;font-size:11px;background:var(--line);border:2px solid #6b4fb0;padding:2px 8px;border-radius:9px;white-space:nowrap}
.node .st{position:absolute;top:2px;right:-2px;display:flex}
@keyframes glow{50%{box-shadow:0 0 0 6px #ffc83d44,0 0 34px #ffc83d88}}
@keyframes bob{50%{transform:translateY(-7px)}}
/* arena */
.arena{position:relative;height:290px;border-radius:24px;overflow:hidden;border:3px solid #6b4fb0;box-shadow:0 14px 34px #0007}
.arena .scene{position:absolute;inset:0;width:100%;height:100%}
.fighter .sprite{width:min(190px,40vw);aspect-ratio:200/220;animation:bob 2.4s ease-in-out infinite}
.fighter.r .sprite{animation-delay:-1.2s}
.fighter.r.boss .sprite{width:min(225px,46vw)}
.plate{display:flex;flex-direction:column;gap:3px;width:100%;max-width:200px;position:absolute;top:10px;z-index:3}
.plate.l{left:12px}.plate.r{right:12px}
.fw{position:absolute;bottom:8px;z-index:2;display:flex}.fw.l{left:3%}.fw.r{right:3%}
.name{font-weight:900;font-size:13px;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:16px;background:#0009;border-radius:9px;overflow:hidden;border:2px solid var(--line);box-shadow:0 0 0 2px #ffffff30;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(#a6ff6b,#19c27a);transition:width .35s;box-shadow:inset 0 3px 0 #ffffff55}
.plate.r .hp i{background:linear-gradient(#ff8a6b,#e0193f)}
.hp em{position:absolute;inset:0;font-size:10px;font-style:normal;font-weight:900;display:grid;place-items:center;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-12px) rotate(-6deg);filter:brightness(2.6) saturate(0)}60%{transform:translateX(8px)}}
.lunge-r{animation:lr .36s}.lunge-l{animation:ll .36s}
@keyframes lr{50%{transform:translateX(70%) scale(1.08)}}
@keyframes ll{50%{transform:translateX(-70%) scale(1.08)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(5px,-3px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,2px)}}
.dmg{position:absolute;font-family:var(--display);font-size:34px;z-index:6;pointer-events:none;-webkit-text-stroke:2px #2a1638;paint-order:stroke;animation:fly 1s forwards;white-space:nowrap}
@keyframes fly{0%{transform:scale(.4)}20%{transform:scale(1.25)}100%{transform:translateY(-80px) scale(1);opacity:0}}
.spark{position:absolute;z-index:5;pointer-events:none;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff,var(--c) 60%,transparent 70%);box-shadow:0 0 12px var(--c);animation:burst .65s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.slash{position:absolute;z-index:5;pointer-events:none;width:170px;height:170px;animation:slash .4s ease-out forwards}
@keyframes slash{0%{transform:rotate(-40deg) scale(.6);opacity:0}30%{opacity:1}100%{transform:rotate(40deg) scale(1.1);opacity:0}}
.proj{position:absolute;z-index:5;width:34px;height:34px;border-radius:50%;pointer-events:none;background:radial-gradient(#fff,var(--c) 45%,transparent 70%);box-shadow:0 0 24px var(--c)}
.banner{position:absolute;inset:0;display:grid;place-items:center;z-index:7;font-family:var(--display);font-size:clamp(30px,7vw,48px);color:var(--gold);-webkit-text-stroke:2px #6a3500;paint-order:stroke;text-shadow:0 5px 0 #6a3500,0 10px 24px #000a;pointer-events:none;animation:pop 1s forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{opacity:0}}
.orb{animation:orb 1.4s ease-in-out infinite}@keyframes orb{50%{opacity:.7}}
.glow{animation:orb 1s ease-in-out infinite}
.float{animation:bob 3s ease-in-out infinite}
.blink{animation:blink 4.5s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* bars */
.bars{display:flex;gap:10px;align-items:center}
.energy{flex:1;height:14px;background:#0008;border-radius:9px;overflow:hidden;border:2px solid var(--line);box-shadow:0 0 0 2px #ffffff22}
.energy i{display:block;height:100%;width:0;background:linear-gradient(90deg,#47b8ff,#b06bff);transition:width .3s;box-shadow:inset 0 3px 0 #ffffff55}
.combo{font-family:var(--display);color:var(--gold);min-width:96px;text-align:right;-webkit-text-stroke:1px #6a3500}
/* question */
.qcard{display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--dim);font-size:13px;font-weight:700}
.word{font-weight:900;font-size:clamp(30px,8vw,44px);text-align:center;margin:0;color:var(--ink);text-shadow:0 3px 0 #0008;letter-spacing:.5px}
.timer{height:9px;background:#0007;border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ember),var(--gold))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:linear-gradient(#ffffff26,#ffffff10);border:2px solid #ffffff35;border-radius:16px;padding:13px 10px;font-weight:800;font-size:16px;min-height:56px;box-shadow:inset 0 -4px 0 #0003;transition:transform .08s,background .15s}
.opt:hover{background:linear-gradient(#ffffff3a,#ffffff18);transform:translateY(-2px)}
.opt.ok{background:linear-gradient(#6ff5bf,#19c27a);border-color:#c6ffe6;color:#03301c}
.opt.bad{background:linear-gradient(#ff7b95,#c2193f);border-color:#ffb3c2}
.skill{display:flex;gap:10px;flex-wrap:wrap}.skill .btn{flex:1;min-width:150px;font-size:15px;padding:12px}
.btn.ready{animation:ready 1s ease-in-out infinite}@keyframes ready{50%{box-shadow:0 6px 0 #4b1fa8,0 0 30px #b06bff}}
/* shop & misc */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.item{background:linear-gradient(170deg,#ffffff18,#ffffff06);border:2px solid #ffffff22;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.item small{color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.learned{display:flex;flex-wrap:wrap;gap:6px}
.learned span{background:#2fe39a1f;border:1px solid #2fe39a66;border-radius:10px;padding:4px 9px;font-size:14px}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .sprite{width:170px;height:186px}
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(#ffc83d22 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite;pointer-events:none;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.result>*{position:relative}.result{overflow:hidden}
.foot{color:var(--dim);font-size:12px;text-align:center}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
@media (max-width:480px){.arena{height:250px}.plate{max-width:150px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="bgsky"></div>
<canvas id="stars"></canvas>
<div class="app">
  <div class="top">
    <a class="logo" href="/" style="text-decoration:none" title="На tatartel.ru">БАТЫР АРЕНА</a>
    <div class="chip" title="Уровень героя"><span id="lvlic"></span><span id="lvl">1</span></div>
    <div class="chip" title="Золото"><span id="goldic"></span><span id="gold">0</span></div>
    <div class="chip" title="Выучено слов"><span id="bookic"></span><span id="wcount">0</span></div>
    <button class="chip icon" id="snd" aria-label="Звук"></button>
  </div>
  <main id="view" class="screen"></main>
  <div class="foot">Отвечай верно — бей сильнее. Быстрый ответ — критический удар. Слова из курса tatartel.ru</div>
</div>

<script>
// ===== Нарисованные персонажи (SVG). viewBox 0 0 200 220, земля y≈208 =====
const O = 'stroke="#2a1638" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
const G = (id, a, b, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const R = (id, a, b) => `<radialGradient id="${id}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
const shadow = `<ellipse cx="100" cy="210" rx="62" ry="9" fill="#000" opacity=".28"/>`;
const svg = (defs, body, vb = "0 0 200 220") => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
const eye = (x, y, r = 7, iris = "#2a1638") => `<g class="blink" style="transform-origin:${x}px ${y}px"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.2}" fill="#fff" ${O} stroke-width="2.5"/><circle cx="${x + r * .25}" cy="${y + r * .15}" r="${r * .62}" fill="${iris}"/><circle cx="${x + r * .45}" cy="${y - r * .2}" r="${r * .25}" fill="#fff"/></g>`;
const cheek = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4" fill="#ff7b8a" opacity=".55"/>`;
// татарский орнамент-тюльпан
const tulip = (x, y, s = 1, c = "#ffc83d") => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 8 C-7 2 -7 -6 -3 -9 C-2 -4 0 -3 0 -3 C0 -3 2 -4 3 -9 C7 -6 7 2 0 8Z" fill="${c}" stroke="#2a1638" stroke-width="1.5"/><path d="M0 8 L0 14" stroke="${c}" stroke-width="2"/></g>`;

const SPR = {};

SPR.batyr = () => svg(
  G("bK", "#e2463a", "#9c1f2a") + G("bH", "#e9eef6", "#8d9bb3") + G("bB", "#f4f7fb", "#8e9ab0", 1, 0) + R("bS", "#ffd9b8", "#e9a77d"),
  `${shadow}
  <path d="M74 186 h20 v20 h-26 q0-10 6-20Z M108 186 h20 q6 10 6 20 h-26Z" fill="#5a2c1c" ${O}/>
  <path d="M62 122 Q100 104 138 122 L150 194 Q100 206 50 194Z" fill="url(#bK)" ${O}/>
  <path d="M100 112 V198" stroke="#ffc83d" stroke-width="5"/>
  <rect x="55" y="150" width="90" height="14" rx="4" fill="#ffc83d" ${O} stroke-width="2.5"/>
  ${[66, 82, 100, 118, 134].map(x => `<path d="M${x} 152 l5 5 l-5 5 l-5 -5Z" fill="#c0392b"/>`).join("")}
  ${tulip(72, 180, .9)}${tulip(128, 180, .9)}
  <path d="M60 128 Q42 150 52 168" fill="none" stroke="#9c1f2a" stroke-width="16" stroke-linecap="round"/>
  <path d="M60 128 Q42 150 52 168" fill="none" ${O} stroke-width="0"/>
  <circle cx="53" cy="170" r="9" fill="url(#bS)" ${O} stroke-width="2.5"/>
  <g class="weapon">
   <path d="M150 158 L184 52 L190 56 L160 162Z" fill="url(#bB)" ${O} stroke-width="2.5"/>
   <path d="M184 52 L192 40 L190 56Z" fill="#fff" ${O} stroke-width="2"/>
   <rect x="138" y="152" width="34" height="8" rx="3" transform="rotate(-20 155 156)" fill="#ffc83d" ${O} stroke-width="2.5"/>
   <path d="M150 162 L144 182" stroke="#5a2c1c" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M140 128 Q156 140 152 160" fill="none" stroke="#9c1f2a" stroke-width="16" stroke-linecap="round"/>
  <circle cx="151" cy="160" r="9" fill="url(#bS)" ${O} stroke-width="2.5"/>
  <circle cx="100" cy="80" r="38" fill="url(#bS)" ${O}/>
  <path d="M68 92 Q70 132 100 136 Q130 132 132 92 Q122 108 100 104 Q78 108 68 92Z" fill="#6b3a1f" ${O}/>
  <path d="M86 104 Q100 98 114 104" fill="none" stroke="#2a1638" stroke-width="3"/>
  <path d="M90 110 Q100 116 110 110" fill="#c0392b" stroke="#2a1638" stroke-width="2.5"/>
  ${eye(86, 82, 6.5)}${eye(114, 82, 6.5)}
  <path d="M77 70 L94 73 M106 73 L123 70" stroke="#4a2614" stroke-width="5"/>
  ${cheek(76, 94)}${cheek(124, 94)}
  <path d="M60 72 Q100 2 140 72 Q100 60 60 72Z" fill="url(#bH)" ${O}/>
  <path d="M58 72 Q100 58 142 72 L140 80 Q100 68 60 80Z" fill="#ffc83d" ${O} stroke-width="2.5"/>
  <path d="M100 18 L100 6" stroke="#8d9bb3" stroke-width="5"/>
  <path d="M100 8 Q120 -6 132 14 Q116 8 104 16Z" fill="#e2463a" ${O} stroke-width="2.5"/>
  <circle cx="100" cy="66" r="5" fill="#2fe39a" ${O} stroke-width="2"/>`
);

SPR.sihr = () => svg(
  G("sD", "#2fd08a", "#0f7a5a") + R("sS", "#ffe0c6", "#eeb08d") + R("sO", "#e9fbff", "#38b8ff") + G("sK", "#ffffff", "#d9cfee"),
  `${shadow}
  <path d="M70 70 Q48 120 58 170" fill="none" stroke="#2a1638" stroke-width="15" stroke-linecap="round"/>
  <path d="M70 70 Q48 120 58 170" fill="none" stroke="#3b2240" stroke-width="10" stroke-linecap="round" stroke-dasharray="8 4"/>
  <path d="M130 70 Q152 120 142 170" fill="none" stroke="#2a1638" stroke-width="15" stroke-linecap="round"/>
  <path d="M130 70 Q152 120 142 170" fill="none" stroke="#3b2240" stroke-width="10" stroke-linecap="round" stroke-dasharray="8 4"/>
  <circle cx="58" cy="174" r="5" fill="#ff4f8b" ${O} stroke-width="2"/><circle cx="142" cy="174" r="5" fill="#ff4f8b" ${O} stroke-width="2"/>
  <path d="M70 120 L130 120 L158 204 Q100 212 42 204Z" fill="url(#sD)" ${O}/>
  <path d="M46 192 L56 184 L66 192 L76 184 L86 192 L96 184 L106 192 L116 184 L126 192 L136 184 L146 192 L154 186" fill="none" stroke="#ffc83d" stroke-width="3"/>
  ${tulip(100, 160, 1.2)}${tulip(74, 172, .8, "#ff4f8b")}${tulip(126, 172, .8, "#ff4f8b")}
  <path d="M84 120 L100 140 L116 120" fill="#fff6e6" ${O} stroke-width="2.5"/>
  <g class="weapon">
   <path d="M160 200 L168 64" stroke="#7a4a26" stroke-width="7" stroke-linecap="round"/>
   <path d="M160 200 L168 64" ${O} stroke-width="0"/>
   <path d="M156 70 Q168 50 180 70" fill="none" stroke="#ffc83d" stroke-width="4"/>
   <circle class="orb" cx="168" cy="52" r="15" fill="url(#sO)" ${O} stroke-width="2.5"/>
   <circle cx="163" cy="47" r="4" fill="#fff"/>
  </g>
  <path d="M130 128 Q150 140 160 126" fill="none" stroke="#0f7a5a" stroke-width="14" stroke-linecap="round"/>
  <circle cx="162" cy="124" r="8" fill="url(#sS)" ${O} stroke-width="2.5"/>

// SHA-1 на чистом JS: crypto.subtle недоступен на http-страницах
function sha1(str) {
  const bytes = new TextEncoder().encode(str);
  const ml = bytes.length * 8;
  const len = (((bytes.length + 8) >> 6) + 1) * 64;
  const m = new Uint8Array(len);
  m.set(bytes);
  m[bytes.length] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(len - 4, ml >>> 0);
  dv.setUint32(len - 8, Math.floor(ml / 2 ** 32));
  let h0 = 0x67452301, h1 = 0xefcdab89, h2 = 0x98badcfe, h3 = 0x10325476, h4 = 0xc3d2e1f0;
  const w = new Uint32Array(80);
  const rol = (x, n) => (x << n) | (x >>> (32 - n));
  for (let o = 0; o < len; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 80; i++) w[i] = rol(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      const [f, k] =
        i < 20 ? [(b & c) | (~b & d), 0x5a827999] :
        i < 40 ? [b ^ c ^ d, 0x6ed9eba1] :
        i < 60 ? [(b & c) | (b & d) | (c & d), 0x8f1bbcdc] : [b ^ c ^ d, 0xca62c1d6];
      const t = (rol(a, 5) + f + e + k + w[i]) >>> 0;
      e = d; d = c; c = rol(b, 30) >>> 0; b = a; a = t;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  return [h0, h1, h2, h3, h4].map((x) => x.toString(16).padStart(8, "0")).join("");
}

  $("#back").onclick=mapView;hud();
}
function wordsView(){
  const L=Object.keys(S.learned);
  view.innerHTML=`<h2>Мои слова: ${L.length} из ${W.length}</h2>
  <div class="frame">${L.length?`<div class="learned">${L.map(t=>`<span><b>${t}</b> — ${W.find(w=>w[0]===t)?.[1]||""}</span>`).join("")}</div>`:`<p class="sub">Пока пусто. Победи первого врага — и слова появятся здесь.</p>`}</div>
  <div class="row"><button class="btn blue" id="back">${ic("back",18)} К дороге</button></div>`;$("#back").onclick=mapView;
}

// ---------- бой ----------
let B=null;
function battle(i){
  const s=STAGES[i],st=stats(),h=hero();
  B={i,s,ehp:s.hp,emax:s.hp,hp:st.hp,max:st.hp,atk:st.atk,def:st.def,time:s.t+st.time,combo:0,energy:0,errors:0,lock:false,q:null,timer:null,seen:[]};
  view.innerHTML=`<div class="arena" id="arena">${scene(s.loc)}
   <div class="plate l"><div class="name">${h.name} · ур. ${S.lvl}</div><div class="hp"><i id="php"></i><em id="phpt"></em></div></div>
   <div class="plate r"><div class="name">${s.n} — ${s.ru}</div><div class="hp"><i id="ehp"></i><em id="ehpt"></em></div></div>
   <div class="fw l fighter">${sp(h.id).replace('class="sprite ','id="ps" class="sprite ')}</div>
   <div class="fw r fighter ${s.boss?"boss":""}">${sp(s.k).replace('class="sprite ','id="es" class="sprite ')}</div></div>
  <div class="bars"><span style="font-size:13px;color:var(--dim);font-weight:800;display:flex;gap:4px;align-items:center">${ic("bolt",18)}Сила</span><div class="energy"><i id="en"></i></div><div class="combo" id="combo"></div></div>
  <div class="frame qcard"><div class="qhead"><span id="qmode"></span><span id="qn"></span></div><button class="word" id="word" title="Послушать" style="width:100%"></button><div class="timer"><i id="tm"></i></div><div class="opts" id="opts"></div></div>
  <div class="skill"><button class="btn violet" id="sk" disabled>${ic("bolt",20)} ${h.skill}</button><button class="btn green" id="ck" ${S.chak>0?"":"disabled"}>${ic("chak",22)} Чәк-чәк · ${S.chak}</button></div>`;
  $("#word").onclick=()=>B&&say(B.q.w[0]);$("#sk").onclick=useSkill;$("#ck").onclick=eatChak;
  banner(s.boss?"БОСС!":"В БОЙ!");upd();setTimeout(nextQ,800);
}
function upd(){
  if(!$("#php"))return;
  $("#php").style.width=Math.max(0,B.hp/B.max*100)+"%";$("#phpt").textContent=`${Math.max(0,Math.round(B.hp))} / ${B.max}`;
  $("#ehp").style.width=Math.max(0,B.ehp/B.emax*100)+"%";$("#ehpt").textContent=`${Math.max(0,Math.round(B.ehp))} / ${B.emax}`;
  $("#en").style.width=B.energy+"%";$("#sk").disabled=B.energy<100;$("#sk").classList.toggle("ready",B.energy>=100);
  $("#combo").textContent=B.combo>1?`КОМБО ×${B.combo}`:"";
}
function nextQ(){
  if(!B)return;
  const pool=W.slice(0,Math.min(W.length,20+B.i*7));
  let w,g=0;do{w=pool[Math.random()*pool.length|0]}while(B.seen.includes(w[0])&&++g<50);
  B.seen.push(w[0]);if(B.seen.length>8)B.seen.shift();
  const rev=Math.random()<.35;
  const opts=[w];while(opts.length<4){const x=pool[Math.random()*pool.length|0];if(!opts.includes(x))opts.push(x)}
  opts.sort(()=>Math.random()-.5);
  B.q={w,rev,t0:performance.now()};B.lock=false;
  $("#qmode").textContent=rev?"Как это по-татарски?":"Что значит это слово?";
  $("#qn").textContent=`Сила врага: ${B.s.atk}`;
  $("#word").textContent=rev?w[1]:w[0];if(!rev)say(w[0]);
  $("#opts").innerHTML=opts.map(o=>`<button class="opt" data-k="${o[0]}">${rev?o[0]:o[1]}</button>`).join("");
  $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
  const tm=$("#tm");tm.style.transition="none";tm.style.width="100%";requestAnimationFrame(()=>requestAnimationFrame(()=>{tm.style.transition=`width ${B.time}s linear`;tm.style.width="0%"}));
  clearTimeout(B.timer);B.timer=setTimeout(()=>answer(null),B.time*1000);
}
function answer(btn){
  if(!B||B.lock)return;B.lock=true;clearTimeout(B.timer);
  const ok=btn&&btn.dataset.k===B.q.w[0];
  $("#opts").querySelectorAll(".opt").forEach(b=>{if(b.dataset.k===B.q.w[0])b.classList.add("ok")});
  if(btn&&!ok)btn.classList.add("bad");if(B.q.rev||!ok)say(B.q.w[0]);
  const fast=(performance.now()-B.q.t0)/1000<B.time*.4;
  if(ok){
    S.learned[B.q.w[0]]=1;B.combo++;B.energy=Math.min(100,B.energy+(fast?34:22));
    let d=B.atk*(1+Math.min(B.combo-1,5)*.15);if(fast)d*=1.8;
    let dbl=S.hero==="uk"&&Math.random()<.25;if(dbl)d*=2;
    if(S.hero==="sihr")B.hp=Math.min(B.max,B.hp+4);
    sfx.ok();if(fast)sfx.crit();
    attack(true,Math.round(d),fast?"КРИТ!":dbl?"×2":"",fast?"#ffc83d":"#fff6e6");
  }else{
    B.combo=0;B.errors++;sfx.bad();
    const d=Math.round(B.s.atk*(1-B.def)*(B.s.boss?1.2:1));
    setTimeout(()=>attack(false,d,btn?"":"Время!","#ff4f8b"),350);
  }
  upd();setTimeout(check,1400);
}
function attack(mine,d,label,color){
  const f=$(mine?"#ps":"#es"),t=$(mine?"#es":"#ps"),a=$("#arena");if(!f||!a)return;
  const h=hero();
  const ar=a.getBoundingClientRect(),tr=t.getBoundingClientRect(),fr=f.getBoundingClientRect();
  const tx=tr.left-ar.left+tr.width/2,ty=tr.top-ar.top+tr.height*.45;
  const ranged=mine?S.hero!=="batyr":["albasty","jen","azhdaha","suanasy"].includes(B.s.k);
  const fx=mine?h.fx:B.s.fx;
  let delay=180;
  if(ranged){
    const p=document.createElement("div");p.className="proj";p.style.setProperty("--c",fx);
    const sx=fr.left-ar.left+fr.width*(mine?.8:.2),sy=fr.top-ar.top+fr.height*.4;
    p.style.left=sx-17+"px";p.style.top=sy-17+"px";a.appendChild(p);
    p.animate([{transform:"translate(0,0) scale(.6)"},{transform:`translate(${tx-sx}px,${ty-sy}px) scale(1.2)`}],{duration:300,easing:"ease-in"});
    setTimeout(()=>p.remove(),300);delay=300;
    f.classList.remove("lunge-r","lunge-l");void f.offsetWidth;
  }else{f.classList.remove("lunge-r","lunge-l");void f.offsetWidth;f.classList.add(mine?"lunge-r":"lunge-l")}
  setTimeout(()=>{
    if(!B)return;
    t.classList.remove("hit");void t.offsetWidth;t.classList.add("hit");sfx.hit();
    a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");
    if(mine)B.ehp-=d;else B.hp-=d;
    const sl=document.createElement("div");sl.className="slash";sl.style.left=tx-85+"px";sl.style.top=ty-85+"px";
    sl.innerHTML=`<svg viewBox="0 0 100 100"><path d="M10 80 Q50 10 92 22" fill="none" stroke="${fx}" stroke-width="9" stroke-linecap="round"/><path d="M10 80 Q50 10 92 22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;
    a.appendChild(sl);setTimeout(()=>sl.remove(),400);
    float(`${label?label+" ":""}−${d}`,tx-30,ty-60,color);
    sparks(tx,ty,fx);upd();
  },delay);
}
function float(txt,x,y,color){const a=$("#arena");if(!a)return;const e=document.createElement("div");e.className="dmg";e.textContent=txt;x=Math.max(6,Math.min(x,a.clientWidth-txt.length*19));e.style.cssText=`left:${x}px;top:${y}px;color:${color}`;a.appendChild(e);setTimeout(()=>e.remove(),1000)}
function sparks(x,y,c){const a=$("#arena");for(let k=0;k<14;k++){const e=document.createElement("div");e.className="spark";const ang=Math.random()*6.28,r=40+Math.random()*70;e.style.cssText=`left:${x-5}px;top:${y-5}px;--c:${k%3?c:"#fff6c0"};--dx:${Math.cos(ang)*r}px;--dy:${Math.sin(ang)*r}px`;a.appendChild(e);setTimeout(()=>e.remove(),650)}}
function banner(t){const a=$("#arena");if(!a)return;const e=document.createElement("div");e.className="banner";e.textContent=t;a.appendChild(e);setTimeout(()=>e.remove(),1000)}
function useSkill(){if(!B||B.energy<100||B.lock)return;B.lock=true;clearTimeout(B.timer);B.energy=0;const h=hero();sfx.crit();banner(h.skill.toUpperCase());
  attack(true,Math.round(B.atk*h.mul),"СУПЕР","#47b8ff");upd();setTimeout(check,1200)}
function eatChak(){if(!B||S.chak<1)return;S.chak--;B.hp=Math.min(B.max,B.hp+40);save();sfx.win();
  const p=$("#ps").getBoundingClientRect(),a=$("#arena").getBoundingClientRect();float("+40",p.left-a.left+p.width/2-20,p.top-a.top+20,"#2fe39a");
  $("#ck").disabled=true;$("#ck").innerHTML=`${ic("chak",22)} Чәк-чәк · ${S.chak}`;upd()}
function check(){if(!B)return;if(B.ehp<=0)return finish(true);if(B.hp<=0)return finish(false);nextQ()}
function finish(win){
  clearTimeout(B.timer);const b=B;B=null;
  if(win){
    const stars=b.errors===0?3:b.errors<=2?2:1;
    const gold=20+b.i*10+stars*10,xp=30+b.i*12;
    S.gold+=gold;S.xp+=xp;S.stars[b.i]=Math.max(S.stars[b.i]||0,stars);
    if(b.i===S.stage&&S.stage<STAGES.length-1)S.stage++;else if(b.i===STAGES.length-1)S.stage=STAGES.length-1;
    let up=false;while(S.xp>=S.lvl*100){S.xp-=S.lvl*100;S.lvl++;up=true}
    save();sfx.win();hud();
    const final=b.i===STAGES.length-1;
    view.innerHTML=`<div class="frame result"><div class="rays"></div>${sp(S.hero)}<h1>${final?"Казань спасена!":"Җиңү! Победа!"}</h1>
     <div class="row" style="justify-content:center">${ic("star",40).repeat(stars)}${ic("starOff",40).repeat(3-stars)}</div>
     <p class="sub">${b.s.n} повержен. ${ic("coin",18)} +${gold} · +${xp} опыта${up?` · <b style="color:var(--gold)">Новый уровень ${S.lvl}!</b>`:""}</p>
     <div class="row" style="justify-content:center"><button class="btn" id="nx">${final?"К дороге":"Следующий бой"}</button><button class="btn blue" id="mp">Дорога</button></div></div>`;
    confetti();
    $("#nx").onclick=()=>final?mapView():battle(S.stage);$("#mp").onclick=mapView;
  }else{
    sfx.lose();S.gold+=5;save();hud();
    view.innerHTML=`<div class="frame result">${sp(b.s.k)}<h1>Ой, не вышло</h1>
     <p class="sub">${b.s.n} оказался сильнее. Купи снаряжение на базаре или повтори слова — и возвращайся. ${ic("coin",18)} +5 за смелость.</p>
     <div class="row" style="justify-content:center"><button class="btn" id="rt">Ещё раз</button><button class="btn blue" id="sh">${ic("shop",20)} Базар</button><button class="btn green" id="mp">Дорога</button></div></div>`;
    $("#rt").onclick=()=>battle(b.i);$("#sh").onclick=shopView;$("#mp").onclick=mapView;
  }
}
function confetti(){const C=["#ffc83d","#ff4f8b","#2fe39a","#47b8ff","#ff5e3a","#b06bff"];for(let k=0;k<70;k++){const e=document.createElement("div");e.className="conf";e.style.cssText=`left:${Math.random()*100}vw;background:${C[k%6]};--dx:${(Math.random()-.5)*160}px;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s;border-radius:${k%2?"50%":"2px"}`;document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}

// ---------- звёзды фона ----------
(function(){const c=$("#stars"),x=c.getContext("2d");let st=[];function rs(){c.width=innerWidth;c.height=innerHeight;st=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height*.7,r:Math.random()*1.6+.3,p:Math.random()*6}))}rs();addEventListener("resize",rs);
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 (function f(t){x.clearRect(0,0,c.width,c.height);st.forEach(s=>{x.globalAlpha=.3+.6*Math.abs(Math.sin(s.p+(reduce?0:t/900)));x.fillStyle="#fff6e6";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});if(!reduce)requestAnimationFrame(f)})(0)})();

hud();S.hero?mapView():pickHero();
</script>
</body></html>

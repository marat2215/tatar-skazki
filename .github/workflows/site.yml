# Собирает учебную базу сайта и озвучку (TatarTTS) при изменении контента.
name: site
on:
  push:
    branches: [main]
    paths: ["content/**", "phrases/**", "stories/**", "games/*.html", "scripts/build_site.py", "web/tts-extra.txt", ".github/workflows/site.yml"]
  workflow_run:
    workflows: [unpack]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: site
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install piper-tts numpy gdown
      - uses: actions/cache@v4
        with: { path: models, key: tatartts-female-v1 }
      - run: python scripts/get_model.py
      - run: python scripts/build_site.py --audio
      - name: tts for games and site sections (web/tts-extra.txt)
        run: |
          python - <<'PY'
          import sys, hashlib, pathlib
          sys.path.insert(0, "scripts")
          from tts import synthesize
          out = pathlib.Path("audio/site"); out.mkdir(parents=True, exist_ok=True)
          src = pathlib.Path("web/tts-extra.txt")
          texts = {l.strip() for l in src.read_text(encoding="utf-8").splitlines() if l.strip()} if src.exists() else set()
          new = 0
          for t in sorted(texts):
              f = out / (hashlib.sha1(t.encode()).hexdigest()[:12] + ".mp3")
              if not f.exists():
                  synthesize(t, str(f), speed=1.2); new += 1
          print("extra tts new:", new, "of", len(texts))
          PY
      - name: commit
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add site/data.json audio/site
          git diff --cached --quiet || (git commit -m "Сайт: обновлена база и озвучка" && git push)
